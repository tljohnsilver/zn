<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">zn architecture</title>
  <desc id="d">Untrusted input flows in parallel to a rules engine and a local neural camera; both feed a single fused-verdict threshold that either allows the agent to proceed or blocks and audits to the local vault.</desc>
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.6" flood-color="#334155" flood-opacity="0.13"/>
    </filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.5 L9 5 L0 8.5 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- card background: stays legible on light and dark GitHub themes -->
  <rect x="0" y="0" width="1000" height="300" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <g stroke="#94a3b8" stroke-width="2" fill="none">
    <path d="M218 134 H250 Q256 134 256 128 V94 Q256 88 262 88 H316" marker-end="url(#ah)"/>
    <path d="M218 166 H250 Q256 166 256 172 V206 Q256 212 262 212 H316" marker-end="url(#ah)"/>
    <path d="M522 88 H530 Q536 88 536 94 V144 Q536 150 542 150 H548" marker-end="url(#ah)"/>
    <path d="M522 212 H530 Q536 212 536 206 V156 Q536 150 542 150 H548" marker-end="url(#ah)"/>
    <path d="M754 150 H766 Q772 150 772 144 V94 Q772 88 778 88 H796" marker-end="url(#ah)"/>
    <path d="M754 150 H766 Q772 150 772 156 V206 Q772 212 778 212 H796" marker-end="url(#ah)"/>
  </g>

  <!-- untrusted input -->
  <rect x="26" y="106" width="192" height="88" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#ds)"/>
  <g text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
    <text x="122" y="142" font-size="15" font-weight="600" fill="#334155">Untrusted input</text>
    <text x="122" y="160" font-size="10.5" fill="#64748b" textLength="114" lengthAdjust="spacingAndGlyphs">prompts · tool results</text>
    <text x="122" y="176" font-size="10.5" fill="#64748b" textLength="136" lengthAdjust="spacingAndGlyphs">documents · tool-call args</text>
  </g>

  <!-- rules engine -->
  <rect x="318" y="44" width="204" height="88" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" filter="url(#ds)"/>
  <g text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
    <text x="420" y="84" font-size="15" font-weight="600" fill="#1d4ed8">Rules engine</text>
    <text x="420" y="104" font-size="10.5" fill="#64748b" textLength="150" lengthAdjust="spacingAndGlyphs">~50 µs · Aho-Corasick + regex</text>
  </g>

  <!-- neural camera -->
  <rect x="318" y="168" width="204" height="88" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" filter="url(#ds)"/>
  <g text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
    <text x="420" y="208" font-size="15" font-weight="600" fill="#6d28d9">Neural camera</text>
    <text x="420" y="228" font-size="10.5" fill="#64748b" textLength="165" lengthAdjust="spacingAndGlyphs">local ONNX encoder + linear head</text>
  </g>

  <!-- fused verdict -->
  <polygon points="550,150 650,84 750,150 650,216" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4" filter="url(#ds)"/>
  <g text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
    <text x="650" y="146" font-size="14.5" font-weight="600" fill="#92400e">Fused verdict</text>
    <text x="650" y="166" font-size="11" font-weight="700" letter-spacing="0.6" fill="#b45309">ONE THRESHOLD</text>
  </g>

  <!-- allow -->
  <rect x="798" y="48" width="178" height="80" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.2" filter="url(#ds)"/>
  <g text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
    <text x="887" y="84" font-size="15" font-weight="600" fill="#047857">allow</text>
    <text x="887" y="105" font-size="10.5" fill="#64748b">agent proceeds</text>
  </g>

  <!-- block -->
  <rect x="798" y="172" width="178" height="80" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2" filter="url(#ds)"/>
  <g text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif">
    <text x="887" y="208" font-size="15" font-weight="600" fill="#b91c1c">block</text>
    <text x="887" y="229" font-size="10.5" fill="#64748b" textLength="160" lengthAdjust="spacingAndGlyphs">reason + audited to local vault</text>
  </g>
</svg>

name: 'zn-gate AI Agent Security Linter'
description: 'Fast, deterministic security scanner and prompt-injection linter for AI agent prompts, tools, and configurations.'
author: 'zn <admin@usezn.com>'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Path or directory to scan for prompt injections and leaked secrets'
    required: false
    default: '.'
  fail-on-threat:
    description: 'Whether to fail the CI step if any threat is detected (true/false)'
    required: false
    default: 'true'
  format:
    description: 'Output format: github (default, with inline annotations), text, or json'
    required: false
    default: 'github'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install zn-gate
      shell: bash
      run: python -m pip install zn-gate
    - name: Run zn-gate security scan
      shell: bash
      run: |
        NO_FAIL_FLAG=""
        if [ "${{ inputs.fail-on-threat }}" = "false" ]; then
          NO_FAIL_FLAG="--no-fail"
        fi
        python -m zn_gate.cli scan "${{ inputs.path }}" --format "${{ inputs.format }}" $NO_FAIL_FLAG

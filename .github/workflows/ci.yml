name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lance-encoding v1.0.4 build script requires a real `protoc` binary.
      # Pinned to 29.3 to match the Dockerfile (Debian's 3.21 breaks the build).
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          include-pre-releases: false
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --locked

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same protoc requirement as the test job (lance-encoding v1.0.4).
      - uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          include-pre-releases: false
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Security audit
        # audit.toml documents every accepted advisory (no-fix-available /
        # unmaintained transitive deps) with justification. This job is strict:
        # any NEW advisory fails the build.
        run: cargo audit

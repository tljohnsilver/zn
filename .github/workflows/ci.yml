name: zn CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-node:
    name: Node.js Tests & Benchmarks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run zn-gate unit tests
        run: |
          cd packages/zn-gate
          npm test
      - name: Run zn-gate integration tests
        run: |
          cd packages/zn-gate
          node tests/integration/test_agent_workflows.js
      - name: Run benchmark verification
        run: |
          node bench/bench_node.js

  test-python:
    name: Python Tests & Benchmarks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e packages/zn-gate-py
      - name: Run pytest (Unit + Integration)
        run: |
          cd packages/zn-gate-py
          python -m pytest tests/ -v
      - name: Run benchmark verification
        run: |
          python bench/bench_python.py
